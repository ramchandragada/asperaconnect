[workspace]
resolver = "2"
members = [
  "crates/core",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0-beta.5"
edition = "2021"
license = "Apache-2.0"
authors = ["Aspera Connect Contributors"]
repository = "https://github.com/aspera-connect/aspera-connect"

[workspace.dependencies]
aspera-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "fs", "net"] }
which = "7"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
regex = "1"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

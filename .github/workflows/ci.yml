name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]

jobs:
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf \
            libssl-dev libgtk-3-dev libayatana-appindicator3-dev build-essential
      - name: npm install
        working-directory: apps/desktop
        run: npm ci
      - name: Check frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check Rust
        run: cargo check --workspace
      - name: Tauri build
        working-directory: apps/desktop
        run: npm run tauri:build
      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: aspera-connect-linux
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Compile companion sources (syntax gate)
        run: |
          # Full Gradle assemble needs wrapper jar; validate Kotlin sources exist
          test -f apps/android/app/src/main/java/com/asperaconnect/companion/MainActivity.kt
          test -f apps/android/app/src/main/AndroidManifest.xml
